<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MUM Apps</title>
<meta name="description" content="MUM Apps makes independent mobile games.">
<style>
  :root { --bg: #ffffff; --text: #1d2228; --muted: #5a6470; --line: #e3e7ec; --accent: #c98a00; --box: #f6f8fa; }
  @media (prefers-color-scheme: dark) { :root { --bg: #12161b; --text: #e6eaef; --muted: #9aa5b1; --line: #2a313a; --accent: #ffc94a; --box: #1a2027; } }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 56px 16px 64px; }
  h1 { font-size: 38px; margin: 0 0 4px; letter-spacing: 1px; }
  h2 { font-size: 22px; margin: 0 0 4px; }
  .muted { color: var(--muted); }
  .game { display: block; margin: 32px 0; padding: 18px 20px; border: 1px solid var(--line); border-radius: 12px; background: var(--box); color: var(--text); text-decoration: none; }
  .game:hover { border-color: var(--accent); }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
<h1>MUM Apps</h1>
<p class="muted">Independent mobile games.</p>
<a class="game" href="/reactorguard/">
  <h2>Reactor Guard</h2>
  <span class="muted">Tower defense for iPhone. Guard the reactor core through a thousand levels.</span>
</a>
<p>Contact: <a href="mailto:info@mumapps.com">info@mumapps.com</a></p>
<p class="muted" lang="tr">Bağımsız mobil oyunlar. İletişim: <a href="mailto:info@mumapps.com">info@mumapps.com</a></p>
</main>
</body>
</html>
